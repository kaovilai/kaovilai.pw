version: 2

multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      all:
        applies_to:
          - version_updates
          - security_updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      all:
        applies_to:
          - version_updates
          - security_updates
        patterns:
          - "*"
